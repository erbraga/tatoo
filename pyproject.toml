[project]
name = "tatoo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "erbraga", email = "erbraga@uol.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
tatoo = "tatoo:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
